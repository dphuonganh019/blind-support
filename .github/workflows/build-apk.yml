name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache model giọng nói
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-vn
          key: vosk-model-small-vn-0.4

      - name: Build APK release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Đặt tên file APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEST="TroLyNgheGoi-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Lưu APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TroLyNgheGoi-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Tạo bản phát hành (Release) kèm APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}" "${{ steps.apk.outputs.file }}" \
            --title "Trợ Lý Nghe Gọi v${{ steps.apk.outputs.version }}" \
            --notes "Bản build tự động từ commit ${GITHUB_SHA::7}. Tải file .apk bên dưới về điện thoại để cài." \
            --latest
