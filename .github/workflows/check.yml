name: Kiểm tra build (không phát hành)

on:
  push:
    branches: [ci-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache model giọng nói
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-vn
          key: vosk-model-small-vn-0.4
      - name: Chạy kiểm thử
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build APK release
        run: ./gradlew --no-daemon --stacktrace assembleRelease
